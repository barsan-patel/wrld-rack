<style>
:root{--bg:#F5F5F5;--neon:#59FF00;--ink:#0b0b0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
body.hovering #c{cursor:pointer}
body.detail #c{cursor:zoom-out}
body.detail.ongarment #c{cursor:pointer}
button{font-family:inherit;color:inherit}
#logo{position:fixed;top:clamp(14px,2.6vh,28px);left:50%;transform:translateX(-50%);width:clamp(96px,9.5vw,138px);z-index:7;cursor:pointer;filter:drop-shadow(0 8px 14px rgba(89,255,0,.28))}
#logo svg{width:100%;height:auto;display:block;animation:bob 4.5s ease-in-out infinite;transform-origin:50% 60%;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
#logo:hover svg{animation-play-state:paused;transform:scale(1.08) rotate(-3deg)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
.corner{position:fixed;top:clamp(18px,3vh,30px);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;z-index:7;display:flex;gap:16px;align-items:center}
.corner.l{left:clamp(16px,2.4vw,32px)}.corner.r{right:clamp(16px,2.4vw,32px)}
.corner a,.corner button{background:none;border:0;cursor:pointer;text-decoration:none;color:inherit;font:inherit;letter-spacing:inherit}
.corner .dot{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 0 2px #111;display:inline-block;margin-right:6px;vertical-align:1px}
#backBtn{display:none}
body.detail #backBtn{display:inline}
body.detail .corner.l .drop{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(30px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--neon);z-index:8;overflow:hidden;display:flex;align-items:center}
.marquee{display:flex;white-space:nowrap;animation:mq 30s linear infinite;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.marquee span{padding-right:56px}
@keyframes mq{to{transform:translateX(-50%)}}
#avail{position:fixed;left:50%;bottom:calc(50px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;background:#fff;border:1px solid #111;border-radius:999px;padding:12px 28px;font-weight:700;font-size:11px;line-height:1;letter-spacing:.14em;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s;white-space:nowrap}
#avail:hover{background:#111;color:#fff;box-shadow:0 0 0 4px rgba(89,255,0,.55)}
#hoverLabel{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,6px);font-size:12.5px;font-weight:500;color:#2a2a2a;z-index:8;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1)}
#hoverLabel.on{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a;z-index:8;pointer-events:none;transition:opacity .3s;white-space:nowrap}
#detail{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:8;text-align:center;pointer-events:none;opacity:0;width:min(92vw,620px)}
body.detail #detail{pointer-events:auto}
#title{font-weight:900;font-size:clamp(14px,1.45vw,20px);letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
#meta{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:11.5px;font-weight:500;color:#555}
#meta .sep{width:3px;height:3px;border-radius:50%;background:#aaa}
#swatches{display:flex;gap:7px}
.sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.28);cursor:pointer;padding:0;transition:transform .2s}
.sw:hover{transform:scale(1.2)}
.sw.act{box-shadow:0 0 0 2px var(--bg),0 0 0 3.2px #111}
.toggle{position:relative;display:inline-flex;border:1px solid #111;border-radius:999px;padding:3px;margin-top:12px;background:#fff}
.toggle button{position:relative;z-index:1;border:0;background:none;font-weight:700;font-size:10px;line-height:1;letter-spacing:.14em;padding:8px 17px;border-radius:999px;cursor:pointer;color:#111;transition:color .35s;min-width:66px}
.toggle button.act{color:#fff}
.toggle .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#111;border-radius:999px;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.toggle.back .knob{transform:translateX(100%)}
#scrollHint{margin-top:9px;font-size:10px;font-weight:600;letter-spacing:.12em;color:#9a9a9a;text-transform:uppercase}
.nav{position:fixed;top:44%;width:40px;height:40px;border-radius:50%;border:1px solid #111;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;z-index:8;opacity:0;pointer-events:none;transition:opacity .35s,background .2s,color .2s}
.nav svg{width:14px;height:14px}
.nav:hover{background:#111;color:#fff}
.nav.prev{left:clamp(10px,2.2vw,30px)}.nav.next{right:clamp(10px,2.2vw,30px)}
body.detail .nav{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,10,10,.28);opacity:0;transition:opacity .35s}
#sheet .panel{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100vw);background:#fff;border:1px solid #111;border-bottom:0;border-radius:22px 22px 0 0;padding:22px 22px calc(40px + env(safe-area-inset-bottom));transition:transform .55s cubic-bezier(.2,.9,.2,1);max-height:78vh;overflow:auto}
#sheet.open{pointer-events:auto}#sheet.open .scrim{opacity:1}#sheet.open .panel{transform:translate(-50%,0)}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h3{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.sh-head p{font-size:12px;color:#666;margin-top:4px}
#shClose{border:1px solid #111;background:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:14px;flex:none}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}
.size{border:1px solid #111;border-radius:12px;padding:12px 0 9px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;background:#fff;transition:background .2s}
.size small{display:block;font-size:9px;font-weight:600;letter-spacing:.06em;margin-top:5px;color:#666;text-transform:uppercase}
.size.low small{color:#c26b00}.size.out{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.size.sel{background:var(--neon)}
.cta{margin-top:18px;width:100%;border:1px solid #111;background:#111;color:#fff;border-radius:999px;padding:14px;font-weight:800;font-size:11px;letter-spacing:.14em;cursor:pointer}
.cta.done{background:var(--neon);color:#111}
.list{margin-top:14px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-top:1px solid #e5e5e5;font-size:13px;font-weight:600;cursor:pointer}
.row:hover{background:#fafafa}
.row .st{font-size:10px;font-weight:800;letter-spacing:.1em;padding:5px 9px;border-radius:999px;background:#eee}
.row .st.ok{background:var(--neon)}
#loader{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;transition:opacity .6s}
#loader .ld{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:10px;font-weight:700;letter-spacing:.2em;color:#777}
#loader .track{width:120px;height:3px;background:#e2e2e2;border-radius:3px;overflow:hidden}
#loader .fill{height:100%;width:0;background:#111;transition:width .3s}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;font-weight:600;z-index:40;background:var(--bg)}
@media (max-width:640px){
  .corner .hide-sm{display:none}
  #avail{padding:12px 22px}
  #hoverLabel{font-size:11.5px}
  #title{font-size:15px}
  .nav{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));width:36px;height:36px}
}

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================================================================

   ================================================================ */
const BRAND = 'WRLD';
const DROP  = 'DROP 026';
const PRODUCTS = [

    variants:[ {name:'White / Red', base:'#f2f0eb', ink:'#d61f2a', ink2:'#161616'},
               {name:'Black / Red', base:'#1c1c1e', ink:'#e3262f', ink2:'#f2f0eb'},
               {name:'Cream / Cobalt', base:'#efe5cf', ink:'#2446d6', ink2:'#161616'} ] },
  { id:'slogan', name:'Stay Soft Heavyweight Tee', shape:'tee', art:'slogan', price:'₹2,199',

  { id:'tank', name:'Distressed Painted Logo Tank Top', shape:'tank', art:'tank', price:'₹2,499', wash:true, holes:true,
    variants:[ {name:'Black', base:'#2b2b2d', ink:'#f1f1ec', ink2:'#f1f1ec'},
               {name:'Tan', base:'#d9c4a1', ink:'#2a2622', ink2:'#2a2622'},

    variants:[ {name:'Black / White', base:'#141414', sleeve:'#f0ece2', ink:'#f0ece2', ink2:'#c8202c'},
               {name:'Forest / Cream', base:'#173e28', sleeve:'#efe4cb', ink:'#efe4cb', ink2:'#d9a21b'},
               {name:'Navy / Grey', base:'#17223e', sleeve:'#c8c8c8', ink:'#e9e9e9', ink2:'#e0362c'} ] },
  { id:'club', name:'Boxy Club Tee', shape:'tee', art:'club', price:'₹2,199',
    variants:[ {name:'Sky Blue', base:'#a2c1e8', ink:'#f7d52a', ink2:'#13233f'},
               {name:'Lilac', base:'#c4b3e6', ink:'#59ff00', ink2:'#1d1240'},
               {name:'Mint', base:'#a9e2c3', ink:'#ff5a8a', ink2:'#0f2e22'} ] },
  { id:'jersey', name:'Home Football Jersey', shape:'tee', art:'jersey', price:'₹2,899', rough:.62,
    variants:[ {name:'Yellow / Green', base:'#f6d81d', ink:'#12924a', ink2:'#0d3a8c'},
               {name:'White / Royal', base:'#f4f4f1', ink:'#1f49c7', ink2:'#d61f2a'},
               {name:'Green / Gold', base:'#14924b', ink:'#f6d81d', ink2:'#0d2f1b'} ] },
  { id:'essential', name:'Essential Logo Tee', shape:'tee', art:'essential', price:'₹1,699',
    variants:[ {name:'White', base:'#f6f6f3', ink:'#3ad600', ink2:'#111111'},
               {name:'Black', base:'#1b1b1b', ink:'#59ff00', ink2:'#f6f6f3'},
               {name:'Neon', base:'#7cff3a', ink:'#111111', ink2:'#111111'} ] },
];

/* ---------------- DOM ---------------- */
const $ = s => document.querySelector(s);
const canvas = $('#c');
document.title = `${BRAND} — ${DROP}`;
document.querySelectorAll('#logo .bt').forEach(t => t.textContent = BRAND);
document.querySelectorAll('.bn').forEach(t => t.textContent = BRAND);
$('#marquee').innerHTML = Array(2).fill(Array(6).fill(`<span>${BRAND} — ${DROP} — 7 PIECES — LIMITED RUN — WORLDWIDE SHIPPING</span>`).join('')).join('');

const isTouch = matchMedia('(pointer:coarse)').matches;
if (isTouch) $('#hint').textContent = 'Tap a piece · Drag to browse';
const TEXR = (isTouch || Math.min(innerWidth, innerHeight) < 640) ? 0.62 : 0.95;
const setLoad = p => $('#ldFill').style.width = (p * 100).toFixed(0) + '%';

/* ---------------- utils ---------------- */
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rgb(h){ h = h.replace('#',''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, a){ const f = v => Math.max(0, Math.min(255, Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a))); const [r,g,b] = rgb(h); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function lum(h){ const [r,g,b] = rgb(h); return (0.299*r + 0.587*g + 0.114*b) / 255; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const titleCase = s => s[0].toUpperCase() + s.slice(1).toLowerCase();

/* ---------------- garment silhouettes (canvas space 1000 x 1150) ---------------- */
const CW = 1000, CH = 1150, HOOK = 0.30;
const SHAPES = {
  tee: { W:1.55, depth:.065, neck:[125,70], tagX:.9,
    body:n => `M375,48 Q500,${n} 625,48 L770,88 Q790,220 800,372 L808,1118 Q500,1138 192,1118 L200,372 Q210,220 230,88 Z`,
    neckLine:n => `M375,48 Q500,${n} 625,48`,
    sleeve:'M768,86 Q905,165 990,335 L866,445 Q835,405 800,372 Q795,220 768,86 Z',
    sleeveHem:'M970,318 L848,426', armSeam:'M770,88 Q790,220 800,372', hem:'M198,1090 Q500,1110 804,1090',
    hang:{cy:62, ex:262, ey:116} },
  tank: { W:1.55, depth:.06, neck:[215,118], tagX:.66,
    body:n => `M330,40 Q500,${n} 670,40 L765,52 Q770,250 880,430 L888,1118 Q500,1138 112,1118 L120,430 Q230,250 235,52 Z`,
    neckLine:n => `M330,40 Q500,${n} 670,40`,
    sleeve:null, arm:'M765,52 Q770,250 880,430', hem:'M118,1090 Q500,1110 882,1090',
    hang:{cy:52, ex:292, ey:70} },
  longsleeve: { W:1.55, depth:.065, neck:[118,70], tagX:.8,
    body:n => `M380,48 Q500,${n} 620,48 L765,88 Q800,200 805,400 L810,1110 Q500,1128 190,1110 L195,400 Q200,200 235,88 Z`,
    neckLine:n => `M380,48 Q500,${n} 620,48`,
    sleeve:'M762,86 Q880,120 905,300 L965,1060 L862,1080 L822,430 Q815,300 800,250 Z',
    cuffY:990, armSeam:'M765,88 Q800,200 805,400', hem:'M196,1084 Q500,1102 804,1084',
    hang:{cy:62, ex:265, ey:116} },
  jacket: { W:1.6, depth:.09, neck:[150,92], tagX:.84,
    body:n => `M368,58 Q500,${n} 632,58 L792,96 Q826,220 830,420 L834,1098 Q500,1110 166,1098 L170,420 Q174,220 208,96 Z`,
    neckLine:n => `M368,58 Q500,${n} 632,58`,
    sleeve:'M788,94 Q905,130 932,310 L988,1048 L876,1066 L844,430 Q838,320 826,250 Z',
    cuffY:985, armSeam:'M792,96 Q826,220 830,420', hem:'M168,1060 Q500,1072 832,1060',
    hang:{cy:72, ex:240, ey:126} },
};
for (const k in SHAPES){
  const S = SHAPES[k]; S.H = S.W * CH / CW;
  S.bodyF = new Path2D(S.body(S.neck[0])); S.bodyB = new Path2D(S.body(S.neck[1]));
  S.neckF = new Path2D(S.neckLine(S.neck[0])); S.neckB = new Path2D(S.neckLine(S.neck[1]));
  if (S.sleeve) S.sleeveP = new Path2D(S.sleeve);
  for (const p of ['sleeveHem','armSeam','hem','arm']) if (S[p]) S[p + 'P'] = new Path2D(S[p]);
}
function mirrored(ctx, fn){ fn(); ctx.save(); ctx.translate(CW, 0); ctx.scale(-1, 1); fn(); ctx.restore(); }
function newCanvas(w = CW, h = CH, r = TEXR){ const c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r); const x = c.getContext('2d'); x.scale(r, r); return [c, x]; }

const maskCache = {};
function silhouette(shapeKey, side){
  const key = shapeKey + side; if (maskCache[key]) return maskCache[key];
  const S = SHAPES[shapeKey]; const [c, x] = newCanvas(); x.fillStyle = '#000';
  x.fill(side === 'front' ? S.bodyF : S.bodyB);
  if (S.sleeveP) mirrored(x, () => x.fill(S.sleeveP));
  return maskCache[key] = c;
}
const _sp = {};
function sleevesPath(S){
  const k = S.sleeve; if (_sp[k]) return _sp[k];
  const p = new Path2D(); p.addPath(S.sleeveP); p.addPath(S.sleeveP, new DOMMatrix([-1, 0, 0, 1, CW, 0])); return _sp[k] = p;
}

/* height map (inflation) from silhouette — blurred mask */
const hmCache = {};
function heightMap(shapeKey){
  if (hmCache[shapeKey]) return hmCache[shapeKey];
  const gw = 90, gh = Math.round(90 * CH / CW);
  const c = document.createElement('canvas'); c.width = gw; c.height = gh; const x = c.getContext('2d', { willReadFrequently:true });

canvas.addEventListener('pointerdown', e => {
  ptr.down = true; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.st = performance.now(); ptr.moved = false; ptr.lastPanX = e.clientX;
  try { canvas.setPointerCapture(e.pointerId); } catch (_){}
  onMove(e);
});
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ ptr.has = false; setHover(-1); } });
canvas.addEventListener('pointerup', e => {
  if (!ptr.down) return; ptr.down = false;
  const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy, dt = performance.now() - ptr.st;
  if (Math.hypot(dx, dy) < 10 && dt < 600){ tap(e.clientX, e.clientY); return; }
  if (state.mode === 'detail' && e.pointerType !== 'mouse'){
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) cycleVariant(dx < 0 ? 1 : -1);
    else if (dy > 70) exitDetail();
    else if (dy < -60) cycleVariant(1);
  }
});
canvas.addEventListener('pointercancel', () => { ptr.down = false; });

function onMove(e){
  const [wx, wy, nx, ny] = toWorld(e.clientX, e.clientY);
  const dwx = ptr.has ? wx - ptr.wx : 0, dwy = ptr.has ? wy - ptr.wy : 0;
  Object.assign(ptr, { x:e.clientX, y:e.clientY, nx, ny, wx, wy, has:true });
  if (ptr.down && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 10) ptr.moved = true;
  if (Math.abs(dwx) < 1.5){
    for (const g of garments){
      if (state.mode === 'detail' && g.i !== state.sel) continue;
      const gx = g.root.position.x, top = g.root.position.y, bottom = top - HOOK - g.S.H;
      const half = state.mode === 'detail' ? g.S.W * .6 : Math.max(g.w * .55, .35);
      if (Math.abs(wx - gx) < half && wy < top + .1 && wy > bottom - .2){
        const depth = clamp((top - wy) / (top - bottom), .15, 1);
        const gain = state.mode === 'detail' ? .35 : 1.25;
        g.thv += clamp(dwx * 3.2 * depth * gain, -1.6, 1.6);
        g.phv += clamp((-Math.abs(dwx) * .9 + dwy * .6) * depth * gain, -1, 1);
      }
    }
  }
  if (state.mode === 'detail') for (const t of tags) t.thv += clamp(dwx * 1.2, -.6, .6);
  if (ptr.down && e.pointerType !== 'mouse' && state.mode === 'rack' && ptr.moved){
    const pxToWorld = (2 * L.halfW) / innerWidth; state.panT += (e.clientX - ptr.lastPanX) * pxToWorld * 1.1; ptr.lastPanX = e.clientX;
  }
  if (state.mode === 'rack' && e.pointerType === 'mouse') setHover(garmentAt(wx, wy));
  if (state.mode === 'detail' && e.pointerType === 'mouse') document.body.classList.toggle('ongarment', hitSelected(e.clientX, e.clientY));
}
const ray = new THREE.Raycaster(); ray.layers.enableAll();
function hitSelected(cx, cy){
  if (state.sel < 0) return false; const g = garments[state.sel];
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  return ray.intersectObjects([g.front, g.back, ...tags.map(t => t.mesh)], false).length > 0;
}
function tap(cx, cy){
  const [wx, wy, nx] = toWorld(cx, cy);
  if (state.mode === 'rack'){ const i = garmentAt(wx, wy); if (i >= 0) select(i); return; }
  if (hitSelected(cx, cy)) return setSide(state.side === 'front' ? 'back' : 'front');
  if (nx < -.62) return step(-1);
  if (nx > .62) return step(1);
  exitDetail();
}

let wheelAcc = 0, wheelLast = 0, wheelLock = 0;
addEventListener('wheel', e => {
  if (e.target.closest && e.target.closest('#sheet')) return;
  e.preventDefault(); const now = performance.now();
  if (state.mode === 'rack'){ state.panT -= (e.deltaX || e.deltaY) * .004; return; }
  if (now - wheelLast > 220) wheelAcc = 0; wheelLast = now; wheelAcc += e.deltaY;
  if (now < wheelLock) return;
  if (wheelAcc > 50){ wheelAcc = 0; wheelLock = now + 750; cycleVariant(1); }
  else if (wheelAcc < -50){ wheelAcc = 0; wheelLock = now + 600; exitDetail(); }
}, { passive:false });
addEventListener('keydown', e => {
  if ($('#sheet').classList.contains('open')){ if (e.key === 'Escape') closeSheet(); return; }
  if (state.mode === 'detail'){
    if (e.key === 'Escape' || e.key === 'ArrowUp') exitDetail();
    else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowDown') cycleVariant(1);
    else if (e.key.toLowerCase() === 'f') setSide('front'); else if (e.key.toLowerCase() === 'b') setSide('back');
  } else if (e.key === 'Enter' && state.hovered >= 0) select(state.hovered);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ const n = PRODUCTS.length, d = e.key === 'ArrowRight' ? 1 : -1; setHover(state.hovered < 0 ? (d > 0 ? 0 : n - 1) : (state.hovered + d + n) % n); }
});

/* ---------------- UI ---------------- */
const hoverLabel = $('#hoverLabel'), hint = $('#hint');
function setHover(i){
  if (state.mode !== 'rack') i = -1;
  if (i === state.hovered) return;
  state.hovered = i; document.body.classList.toggle('hovering', i >= 0);
  if (i >= 0){ const g = garments[i]; hoverLabel.textContent = `[${g.P.name} - ${g.P.variants[g.variant].name}]`; hoverLabel.classList.add('on'); hint.style.opacity = 0; g.phv -= .6; }
  else { hoverLabel.classList.remove('on'); if (state.mode === 'rack') hint.style.opacity = 1; }
}
function updateDetailUI(){
  const g = garments[state.sel]; if (!g) return; const v = g.P.variants[g.variant];
  $('#title').textContent = g.P.name; $('#vname').textContent = v.name; $('#price').textContent = g.P.price;
  const sw = $('#swatches'); sw.innerHTML = '';
  g.P.variants.forEach((vv, k) => { const b = document.createElement('button'); b.className = 'sw' + (k === g.variant ? ' act' : ''); b.title = vv.name; b.setAttribute('aria-label', vv.name);
    b.style.background = vv.sleeve ? `linear-gradient(90deg, ${vv.base} 50%, ${vv.sleeve} 50%)` : vv.base;
    b.onclick = () => setVariant(k); sw.appendChild(b); });
  const tg = $('#toggle'); tg.classList.toggle('back', state.side === 'back');
  tg.querySelectorAll('button').forEach(b => b.classList.toggle('act', b.dataset.side === state.side));
  $('#scrollHint').textContent = isTouch ? 'Swipe for colours · Swipe down to close' : 'Scroll for colours · Scroll up to close';
}
$('#toggle').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSide(b.dataset.side); });
$('#prevBtn').onclick = () => step(-1); $('#nextBtn').onclick = () => step(1);
$('#backBtn').onclick = () => exitDetail(); $('#logo').onclick = () => { closeSheet(); exitDetail(); };
$('#shopAll').onclick = () => openSheet(true);
let bag = 0; $('#bagBtn').onclick = () => openSheet(true);

function isTagChild(o){ for (let p = o; p; p = p.parent) if (p === tagRoot) return true; return false; }
function setLayer(g, l){ g.root.traverse(o => { if (!isTagChild(o)) o.layers.set(l); }); }

function select(i){
  if (state.mode === 'detail'){ if (state.sel !== i) switchTo(i); return; }
  if (state.leaving >= 0 && state.leaving !== i) setLayer(garments[state.leaving], 0);
  state.leaving = -1; state.mode = 'detail'; state.sel = i; state.side = 'front';
  setHover(-1); hint.style.opacity = 0; document.body.classList.add('detail');
  const g = garments[i]; setLayer(g, 1); gsap.killTweensOf(g.flip.rotation); g.flip.rotation.y = 0; g.phv += 1.2; g.thv += (Math.random() - .5);
  attachTags(g); showTags();
  gsap.to(state, { blur:1, fade:1, duration:1.15, ease:'power2.inOut', overwrite:'auto' });
  updateDetailUI();
  gsap.fromTo('#detail', { opacity:0, y:14 }, { opacity:1, y:0, duration:.6, delay:.45, ease:'power3.out', overwrite:'auto' });
  pregen(i);
}
function switchTo(i){
  const old = garments[state.sel]; setLayer(old, 0); gsap.to(old.flip.rotation, { y:0, duration:.6, ease:'power2.out', overwrite:true });
  state.sel = i; state.side = 'front'; const g = garments[i]; setLayer(g, 1); gsap.killTweensOf(g.flip.rotation); g.flip.rotation.y = 0; g.thv += (i > old.i ? -1 : 1) * 1.2;
  attachTags(g); showTags();
  gsap.fromTo('#detail', { opacity:0, y:8 }, { opacity:1, y:0, duration:.5, delay:.2, ease:'power3.out', overwrite:'auto' });
  updateDetailUI(); pregen(i);
}
function step(d){ if (state.mode !== 'detail') return; const n = PRODUCTS.length; select((state.sel + d + n) % n); }
function exitDetail(){
  if (state.mode !== 'detail') return;
  const g = garments[state.sel]; state.mode = 'rack'; state.leaving = state.sel; state.sel = -1; state.side = 'front';
  document.body.classList.remove('detail', 'ongarment');
  gsap.to(g.flip.rotation, { y:0, duration:.8, ease:'power2.inOut', overwrite:true }); g.thv += .8;
  hideTags();
  gsap.to('#detail', { opacity:0, y:10, duration:.3, ease:'power2.in', overwrite:'auto' });
  gsap.to(state, { blur:0, fade:0, duration:1.0, ease:'power2.inOut', overwrite:'auto', onComplete:() => { if (state.mode === 'rack' && state.leaving >= 0){ setLayer(garments[state.leaving], 0); state.leaving = -1; } } });
  hint.style.opacity = 1;
}
function showTags(){ gsap.fromTo(tagRoot.scale, { x:.001, y:.001, z:.001 }, { x:1, y:1, z:1, duration:.8, delay:.35, ease:'back.out(1.8)', overwrite:true }); tags.forEach((t, k) => { t.thv += (k ? -2.5 : 2.5); t.twv += 3; }); }
function hideTags(){ gsap.to(tagRoot.scale, { x:.001, y:.001, z:.001, duration:.3, ease:'power2.in', overwrite:true }); }
function setSide(side){
  if (state.mode !== 'detail' || state.side === side) return;
  state.side = side; const g = garments[state.sel];
  gsap.to(g.flip.rotation, { y:side === 'back' ? Math.PI : 0, duration:1.05, ease:'power3.inOut', overwrite:true });
  g.phv += .5; tags.forEach(t => t.twv += side === 'back' ? -4 : 4);
  updateDetailUI();
}
function cycleVariant(d){ if (state.mode !== 'detail') return; const g = garments[state.sel], n = g.P.variants.length; setVariant((g.variant + d + n) % n); }
function setVariant(k){
  const g = garments[state.sel]; if (!g || k === g.variant) return;
  if (g.wipeTween) g.wipeTween.progress(1);
  const tex = ensureTex(g.i, k); g.variant = k;
  g.m2F.value = tex.front; g.m2B.value = tex.back; g.wipe.value = .0001;
  g.wipeTween = gsap.to(g.wipe, { value:1, duration:.95, ease:'power2.inOut', onComplete:() => { g.matF.map = tex.front; g.matB.map = tex.back; g.wipe.value = 0; g.wipeTween = null; } });
  g.phv += .9; g.thv += .3; tags.forEach(t => t.thv += 1.4);
  setKraft(g); updateDetailUI();
  gsap.fromTo('#vname', { opacity:0, y:4 }, { opacity:1, y:0, duration:.4 });
}
const pregenQ = [];
function pregen(i){ PRODUCTS[i].variants.forEach((_, k) => { if (!TEX[i][k]) pregenQ.push([i, k]); }); }
setInterval(() => { const job = pregenQ.shift(); if (job) ensureTex(job[0], job[1]); }, 120);

/* availability sheet */
const SIZES = ['XS','S','M','L','XL','XXL'];
function stock(P, v, s){ const r = mulberry(hashStr(P.id + v + s))(); return r < .18 ? 'out' : r < .45 ? 'low' : 'ok'; }
function openSheet(forceList){
  const body = $('#shBody'); const idx = state.mode === 'detail' ? state.sel : state.hovered;
  if (idx >= 0 && !forceList){
    const g = garments[idx], v = g.P.variants[g.variant];
    $('#shTitle').textContent = g.P.name; $('#shSub').textContent = `${v.name} · ${g.P.price} · ${DROP}`;
    body.innerHTML = `<div class="sizes">${SIZES.map(s => { const st = stock(g.P, g.variant, s); return `<div class="size ${st}" data-s="${s}">${s}<small>${st === 'out' ? 'Sold out' : st === 'low' ? 'Low' : 'In stock'}</small></div>`; }).join('')}</div><button class="cta" id="addBag">SELECT A SIZE</button>`;
    let chosen = null; const cta = $('#addBag');
    body.querySelectorAll('.size:not(.out)').forEach(el => el.onclick = () => { body.querySelectorAll('.size').forEach(q => q.classList.remove('sel')); el.classList.add('sel'); chosen = el.dataset.s; cta.textContent = `ADD ${chosen} TO BAG`; cta.classList.remove('done'); });
    cta.onclick = () => { if (!chosen) return; bag++; $('#bagN').textContent = bag; cta.textContent = 'ADDED ✓'; cta.classList.add('done'); };
  } else {
    $('#shTitle').textContent = `${BRAND} — ${DROP}`; $('#shSub').textContent = 'Every piece on the rack, live stock.';
    body.innerHTML = `<div class="list">${garments.map(g => { const n = SIZES.filter(s => stock(g.P, g.variant, s) !== 'out').length; return `<div class="row" data-i="${g.i}"><span>${g.P.name}<br><small style="color:#888;font-weight:500">${g.P.variants.length} colours · ${g.P.price}</small></span><span class="st ${n > 3 ? 'ok' : ''}">${n}/6 SIZES</span></div>`; }).join('')}</div>`;
    body.querySelectorAll('.row').forEach(r => r.onclick = () => { closeSheet(); setTimeout(() => select(+r.dataset.i), 250); });
  }
  $('#sheet').classList.add('open');
}
function closeSheet(){ $('#sheet').classList.remove('open'); }
$('#avail').onclick = () => openSheet(false);
$('#shClose').onclick = closeSheet; $('#sheet .scrim').onclick = closeSheet;

/* ---------------- frame loop ---------------- */
const clock = new THREE.Clock(); let time = 0;
const IDLE_TURN = 1.2;
function update(dt){
  time += dt;
  const cx = state.mode === 'rack' ? ptr.nx * .12 : ptr.nx * .05, cy = ptr.ny * .06;
  camera.position.x += (cx - camera.position.x) * damp(3, dt); camera.position.y += (L.camY + cy - camera.position.y) * damp(3, dt);
  camera.lookAt(camera.position.x * .4, L.camY, 0);
  let total = 0;
  for (const g of garments){ const tgt = state.mode === 'rack' && state.hovered === g.i ? 1 : 0; g.hover += (tgt - g.hover) * damp(7, dt); g.w = L.slot + (HOVER_SLOT - L.slot) * g.hover; total += g.w; }
  const excess = Math.max(0, total + .4 - L.halfW * 2 * .96);
  if (!isTouch && state.mode === 'rack' && ptr.has && excess > 0) state.panT = -ptr.nx * excess / 2 * 1.1;
  state.panT = clamp(state.panT, -excess / 2, excess / 2);
  state.pan += (state.panT - state.pan) * damp(6, dt);
  let acc = -total / 2 + state.pan; const sel = state.sel;
  for (const g of garments){
    let tx, ty = 0, tz = 0, turnT, turnX = 0;
    const slotX = acc + g.w / 2; acc += g.w;
    if (state.mode === 'detail'){
      if (g.i === sel){
        tx = L.selX; tz = L.D - L.dSel; ty = L.selCenterY + HOOK + g.S.H / 2;
        turnT = isTouch ? Math.sin(time * .6) * .12 : ptr.nx * .42; turnX = isTouch ? 0 : -ptr.ny * .1;
      } else {
        const n = g.i < sel ? sel - g.i - 1 : g.i - sel - 1, s = g.i < sel ? -1 : 1;
        tx = s * (L.halfW * .9 + n * .75); tz = -.4 - n * .2; turnT = IDLE_TURN;
      }
    } else { tx = slotX; turnT = IDLE_TURN * (1 - g.hover); tz = g.hover * .12; }
    ty += g.intro;
    const k = state.mode === 'detail' || state.leaving >= 0 ? 4.2 : 7;
    const nx = g.x + (tx - g.x) * damp(k, dt), nvx = (nx - g.x) / Math.max(dt, 1e-4);
    const ax = (nvx - g.vx) / Math.max(dt, 1e-4); g.vx = nvx; g.x = nx;
    g.y = state.introDone ? g.y + (ty - g.y) * damp(4.5, dt) : ty; g.z += (tz - g.z) * damp(4.2, dt);
    g.root.position.set(g.x, g.y, g.z);
    g.thv += (-26 * g.th - 2.1 * g.thv - clamp(ax, -60, 60) * .022) * dt;
    g.phv += (-24 * g.ph - 2.3 * g.phv) * dt;
    g.thv = clamp(g.thv, -4, 4); g.phv = clamp(g.phv, -4, 4);
    g.th = clamp(g.th + g.thv * dt, -.55, .55); g.ph = clamp(g.ph + g.phv * dt, -.5, .5);
    g.swing.rotation.z = g.th + Math.sin(time * .9 + g.i * 1.7) * .006; g.swing.rotation.x = g.ph;
    const prevTurn = g.turn.rotation.y;
    g.turn.rotation.y += (turnT - g.turn.rotation.y) * damp(state.mode === 'detail' && g.i === sel ? 5 : 6, dt);
    g.turn.rotation.x += (turnX - g.turn.rotation.x) * damp(5, dt);
    g.turnVel = (g.turn.rotation.y - prevTurn) / Math.max(dt, 1e-4);
    g.U.uBend.value.set(clamp(-g.thv * .07, -.12, .12), clamp(-g.phv * .07, -.12, .12));
    g.U.uRipple.value += (clamp(Math.abs(g.thv) * .45 + Math.abs(g.phv) * .3 + Math.abs(nvx) * .06, 0, 1) - g.U.uRipple.value) * damp(4, dt);
    g.U.uTime.value = time;
  }
  if (tagRoot.scale.x > .01){
    const g = garments.find(q => q.turn === tagRoot.parent);
    for (const t of tags){
      t.thv += (-30 * t.th - 1.6 * t.thv - (g ? g.thv * 1.1 + g.turnVel * .3 : 0)) * dt;
      t.twv += (-22 * t.tw - 1.4 * t.twv - (g ? g.turnVel * 2.2 : 0)) * dt;
      t.th = clamp(t.th + t.thv * dt, -.8, .8); t.tw = clamp(t.tw + t.twv * dt, -1.2, 1.2);
      t.pivot.rotation.z = t.th; t.pivot.rotation.y = t.tw;
    }
  }
  rodMat.opacity = 1 - state.fade * .97; rodG.visible = rodMat.opacity > .02;
}
function render(){
  if (state.blur < .002){ camera.layers.enableAll(); renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera); return; }
  camera.layers.set(0);
  renderer.setRenderTarget(rtSharp); renderer.clear(); renderer.render(scene, camera);
  quad.material = blurMat; blurMat.uniforms.uRes.value.set(rtA.width, rtA.height);
  const k = state.blur * (Math.min(rtA.width, rtA.height) / 500);
  let src = rtSharp.texture;
  for (const s of [1, 2, 3, 4.5]){
    blurMat.uniforms.tDiffuse.value = src; blurMat.uniforms.uDir.value.set(s * k, 0); renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam);
    blurMat.uniforms.tDiffuse.value = rtA.texture; blurMat.uniforms.uDir.value.set(0, s * k); renderer.setRenderTarget(rtB); renderer.render(quadScene, quadCam);
    src = rtB.texture;
  }
  quad.material = compMat; compMat.uniforms.tSharp.value = rtSharp.texture; compMat.uniforms.tBlur.value = rtB.texture;
  compMat.uniforms.uAmt.value = state.blur; compMat.uniforms.uFade.value = state.fade * .28;
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(quadScene, quadCam);
  renderer.clearDepth(); camera.layers.set(1); renderer.render(scene, camera); camera.layers.enableAll();
}
const SIM_MAX = /[?&]sim=1/.test(location.search) ? .6 : .1;
function frame(){
  let dt = Math.min(clock.getDelta(), SIM_MAX);
  while (dt > 1e-5){ const s = Math.min(dt, 1 / 60); update(s); dt -= s; }
  render(); requestAnimationFrame(frame);
}

let a0 = -PRODUCTS.length * L.slot / 2; for (const g of garments){ g.x = a0 + L.slot / 2; a0 += L.slot; g.y = g.intro; g.turn.rotation.y = IDLE_TURN; g.w = L.slot; }
setLoad(1);
renderer.compile(scene, camera);
frame();
gsap.to('#loader', { opacity:0, duration:.6, delay:.15, onComplete:() => $('#loader').remove() });
gsap.from('#logo', { y:-40, scale:.6, opacity:0, duration:1, delay:.3, ease:'back.out(2)' });
gsap.from(['#avail', '#bar', '.corner', '#hint'], { y:20, opacity:0, duration:.8, delay:.5, stagger:.06, ease:'power3.out' });
garments.forEach((g, i) => gsap.to(g, { intro:0, duration:1.1, delay:.35 + i * .085, ease:'power3.out', onComplete:() => { g.thv += (i % 2 ? 1 : -1) * 1.1; g.phv += .9; if (i === garments.length - 1) state.introDone = true; } }));

window.__rack = { select, exitDetail, setSide, setVariant, cycleVariant, step, state, garments, setHover };
}
boot().catch(e => { console.error(e); const el = $('#err'); el.style.display = 'grid'; el.textContent = 'Something went wrong loading the rack.'; });
</script>
</body>
